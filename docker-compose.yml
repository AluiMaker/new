services:
  mapaleads:
    build: .
    container_name: mapaleads-pro
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mapaleads_data:/data
    expose:
      - "5055"

  caddy:
    image: caddy:2-alpine
    container_name: mapaleads-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mapaleads

volumes:
  mapaleads_data:
  caddy_data:
  caddy_config:

